apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallet-service
  template:
    metadata:
      labels:
        app: wallet-service
    spec:
      serviceAccountName: hacmieu-sa
      containers:
        - name: wallet-service
          image: public.ecr.aws/h5u5b6t3/hacmieu/wallet-service:latest
          imagePullPolicy: Always
          env:
            - name: WALLET_SERVICE_GRPC_URL
              value: '0.0.0.0:5008'
          envFrom:
            - secretRef:
                name: hacmieu-secrets
          ports:
            - containerPort: 3008
            - containerPort: 5008
          resources:
            requests:
              cpu: '250m'
              memory: '512Mi'
            limits:
              cpu: '500m'
              memory: '1Gi'
