apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-web-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-web
  template:
    metadata:
      labels:
        app: admin-web
    spec:
      serviceAccountName: hacmieu-sa
      containers:
        - name: admin-web
          image: caophi562005/vshop-admin-web:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: hacmieu-secrets
          ports:
            - containerPort: 4002
          resources:
            requests:
              cpu: '250m'
              memory: '512Mi'
            limits:
              cpu: '500m'
              memory: '1Gi'
