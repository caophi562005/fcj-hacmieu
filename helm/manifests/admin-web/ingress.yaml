apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-web-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-1:491333778094:certificate/f87c1c2e-bc45-4c3e-861d-f824abdc26c7
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/group.name: hacmieu-public
    alb.ingress.kubernetes.io/group.order: '100'
spec:
  ingressClassName: alb
  rules:
    - host: admin.vshop.hacmieu.com
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: admin-web
                port:
                  number: 4002
