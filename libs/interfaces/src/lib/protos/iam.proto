syntax = "proto3";

package IAM_SERVICE;

service AuthModule {
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (Message);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc Logout(LogoutRequest) returns (Message);
}

message RefreshSessionRequest {
  optional string processId = 1;
  string refreshToken = 2;
  string type = 3;
}

message LogoutRequest {
  optional string processId = 1;
  string accessToken = 2;
}

message ChangePasswordRequest {
  optional string processId = 1;
  string previousPassword = 2;
  string proposedPassword = 3;
  string accessToken = 4;
}

message ValidateTokenRequest {
  optional string processId = 1;
  string accessToken = 2;
  string idToken = 3;
  string type = 4;
}

message RefreshSessionResponse {
  string accessToken = 1;
  string idToken = 2;
  string refreshToken = 3;
  int32 expiresIn = 4;
  string tokenType = 5;
  string scope = 6;
}

message Message {
  string message = 1;
}

message ValidateTokenResponse {
  string userId = 1;
  string username = 2;
  repeated string groups = 3;
  repeated Permissions permissions = 4;
  bool isValid = 5;
  string shopId = 6;
  string merchantId = 7;
}

service PermissionModule {
  rpc GetManyPermissions(GetManyPermissionsRequest) returns (GetManyPermissionsResponse);
  rpc GetAllPermissions(GetAllPermissionsRequest) returns (GetAllPermissionsResponse);
  rpc CreatePermission(CreatePermissionRequest) returns (CreatePermissionResponse);
  rpc CreateManyPermissions(CreateManyPermissionsRequest) returns (CountResponse);
  rpc DeleteManyPermissions(DeleteManyPermissionsRequest) returns (CountResponse);
}

message Permissions {
  string id = 1;
  string path = 2;
  string method = 3;
  string group = 4;
}

message GetManyPermissionsRequest {
  optional string processId = 1;
  int32 page = 2;
  int32 limit = 3;
  optional string group = 4;
}

message GetAllPermissionsRequest {
  optional string processId = 1;
  string group = 2;
}

message GetAllPermissionsResponse {
  repeated Permissions permissions = 1;
}

message CreatePermissionResponse {
  string id = 1;
  string name = 2;
  optional string description = 3;
  string module = 4;
  string path = 5;
  string method = 6;
  string group = 7;
  string createdById = 8;
  string updatedById = 9;
  string deletedById = 10;
  string deletedAt = 11;
  string createdAt = 12;
  string updatedAt = 13;
}

message GetManyPermissionsResponse {
  repeated Permissions permissions = 1;
  int32 page = 2;
  int32 limit = 3;
  int32 totalItems = 4;
  int32 totalPages = 5;
}

message CreatePermissionRequest {
  optional string processId = 1;
  string name = 2;
  optional string description = 3;
  string module = 4;
  string path = 5;
  string method = 6;
  string group = 7;
  optional string createdById = 8;
}

message CreateManyPermissionsRequest {
  repeated CreatePermissionRequest permissions = 1;
}

message DeleteManyPermissionsRequest {
  repeated string ids = 1;
}

message CountResponse {
  int32 count = 1;
}

service UserModule {
  rpc GetUser(GetUserRequest) returns (UserResponse);
  rpc GetManyUsers(GetManyUsersRequest) returns (GetManyUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse);
  rpc CreateUser(CreateUserRequest) returns (UserResponse);
}

message GetUserRequest {
  optional string processId = 1;
  optional string id = 2;
  optional string email = 3;
  optional string username = 4;
}

message UpdateUserRequest {
  optional string processId = 1;
  string id = 2;
  optional string phoneNumber = 3;
  optional string avatar = 4;
  optional string gender = 5;
  optional string birthday = 6;
  repeated string group = 7;
  optional int32 provinceId = 8;
  optional string provinceName = 9;
  optional int32 districtId = 10;
  optional string districtName = 11;
  optional int32 wardId = 12;
  optional string wardName = 13;
  optional string address = 14;
}

message CreateUserRequest {
  optional string processId = 1;
  string id = 2;
  string email = 3;
  string username = 4;
  string avatar = 5;
  repeated string group = 6;
}

message UserResponse {
  string id = 1;
  string email = 2;
  string username = 3;
  string phoneNumber = 4;
  string avatar = 5;
  string birthday = 6;
  string gender = 7;
  string status = 8;
  repeated string group = 9;
  string createdById = 10;
  string updatedById = 11;
  string deletedById = 12;
  string deletedAt = 13;
  string createdAt = 14;
  string updatedAt = 15;
  optional int32 provinceId = 16;
  optional string provinceName = 17;
  optional int32 districtId = 18;
  optional string districtName = 19;
  optional int32 wardId = 20;
  optional string wardName = 21;
  optional string address = 22;
}

message GetManyUsersRequest {
  optional string processId = 1;
  int32 page = 2;
  int32 limit = 3;
  optional string email = 4;
  optional string phoneNumber = 5;
  optional string username = 6;
  optional string gender = 7; // "MALE" | "FEMALE" | "OTHER"
  optional string status = 8; // "ACTIVE" | "INACTIVE" | "BLOCKED"
  repeated string group = 9;
  repeated string ids = 10;
}

message GetManyUsersResponse {
  int32 page = 1;
  int32 limit = 2;
  int32 totalItems = 3;
  int32 totalPages = 4;
  repeated UserBasicInfo users = 5;
}

message UserBasicInfo {
  string id = 1;
  string email = 2;
  string username = 3;
  string phoneNumber = 4;
  string gender = 5;
  string status = 6;
  repeated string group = 7;
  string avatar = 8;
}

service MarketingPreferenceModule {
  rpc GetMarketingPreferences(GetMarketingPreferencesRequest) returns (MarketingPreferencesResponse);
  rpc UpdateMarketingPreferences(UpdateMarketingPreferencesRequest) returns (MarketingPreferencesResponse);
  rpc GetMarketingRecipients(GetMarketingRecipientsRequest) returns (GetMarketingRecipientsResponse);
  rpc UnsubscribeMarketing(UnsubscribeMarketingRequest) returns (MarketingPreferencesResponse);
}

message GetMarketingPreferencesRequest {
  optional string processId = 1;
  string userId = 2;
}

message UpdateMarketingPreferencesRequest {
  optional string processId = 1;
  string userId = 2;
  bool promotionOffers = 3;
  bool voucherReminders = 4;
  string consentSource = 5;
  string consentVersion = 6;
}

message GetMarketingRecipientsRequest {
  optional string processId = 1;
  string topic = 2;
  int32 page = 3;
  int32 limit = 4;
  repeated string userIds = 5;
}

message UnsubscribeMarketingRequest {
  optional string processId = 1;
  string email = 2;
  string topic = 3;
}

message MarketingPreferencesResponse {
  string userId = 1;
  bool promotionOffers = 2;
  bool voucherReminders = 3;
}

message MarketingRecipient {
  string userId = 1;
  string email = 2;
  string username = 3;
}

message GetMarketingRecipientsResponse {
  int32 page = 1;
  int32 limit = 2;
  int32 totalItems = 3;
  int32 totalPages = 4;
  repeated MarketingRecipient recipients = 5;
}
