syntax = "proto3";

package WALLET_SERVICE;

service WalletModule {
  rpc GetMyWallet(GetMyWalletRequest) returns (WalletResponse);
  rpc AdjustWallet(AdjustWalletRequest) returns (WalletResponse);
  rpc GetMyTransactions(GetMyTransactionsRequest) returns (GetMyTransactionsResponse);
}

message GetMyWalletRequest {
  optional string processId = 1;
  string userId = 2;
}

message AdjustWalletRequest {
  optional string processId = 1;
  string userId = 2;
  string type = 3; // CREDIT | DEBIT
  string source = 4; // ORDER_REWARD | REVIEW_REWARD | PROMOTION_GIFT | REFERRAL | TOPUP | REFUND | ORDER_PAYMENT | SYSTEM | OTHER
  optional string referenceId = 5;
  int32 amount = 6;
  string description = 7;
}

message GetMyTransactionsRequest {
  optional string processId = 1;
  string userId = 2;
  int32 page = 3;
  int32 limit = 4;
  optional string type = 5;
  optional string source = 6;
}

message WalletResponse {
  string id = 1;
  string userId = 2;
  int32 balance = 3;
  string createdAt = 4;
  string updatedAt = 5;
}

message WalletTransactionResponse {
  string id = 1;
  string walletId = 2;
  string userId = 3;
  string type = 4;
  string source = 5;
  optional string referenceId = 6;
  int32 amount = 7;
  int32 balanceAfter = 8;
  string description = 9;
  string createdAt = 10;
}

message GetMyTransactionsResponse {
  int32 page = 1;
  int32 limit = 2;
  int32 totalItems = 3;
  int32 totalPages = 4;
  repeated WalletTransactionResponse transactions = 5;
}

service CreditModule {
  rpc GetShopCredit(GetShopCreditRequest) returns (CreditResponse);
  rpc AdjustShopCredit(AdjustShopCreditRequest) returns (CreditResponse);
  rpc GetShopCreditTransactions(GetShopCreditTransactionsRequest) returns (GetShopCreditTransactionsResponse);
  rpc GetShopRevenueSummary(GetShopRevenueSummaryRequest) returns (GetShopRevenueSummaryResponse);
}

message GetShopCreditRequest {
  optional string processId = 1;
  string shopId = 2;
}

message AdjustShopCreditRequest {
  optional string processId = 1;
  string shopId = 2;
  string type = 3; // CREDIT | DEBIT
  string source = 4; // ORDER_REVENUE | PLATFORM_FEE | TAX_WITHHOLDING | WITHDRAWAL | REFUND | SYSTEM | OTHER
  optional string referenceId = 5;
  int32 amount = 6;
  string description = 7;
}

message GetShopCreditTransactionsRequest {
  optional string processId = 1;
  string shopId = 2;
  int32 page = 3;
  int32 limit = 4;
  optional string type = 5;
  optional string source = 6;
}

message GetShopRevenueSummaryRequest {
  optional string processId = 1;
  string shopId = 2;
  int32 days = 3;
}

message CreditResponse {
  string id = 1;
  string shopId = 2;
  int32 balance = 3;
  string createdAt = 4;
  string updatedAt = 5;
}

message CreditTransactionResponse {
  string id = 1;
  string creditId = 2;
  string shopId = 3;
  string type = 4;
  string source = 5;
  optional string referenceId = 6;
  int32 amount = 7;
  int32 balanceAfter = 8;
  string description = 9;
  string createdAt = 10;
}

message GetShopCreditTransactionsResponse {
  int32 page = 1;
  int32 limit = 2;
  int32 totalItems = 3;
  int32 totalPages = 4;
  repeated CreditTransactionResponse transactions = 5;
}

message ShopRevenueDayPoint {
  string date = 1;
  int32 amount = 2;
}

message GetShopRevenueSummaryResponse {
  int32 days = 1;
  int32 totalRevenue = 2;
  repeated ShopRevenueDayPoint points = 3;
}

service SellerSettlementModule {
  rpc GetSellerSettlementSummary(GetSellerSettlementSummaryRequest) returns (GetSellerSettlementSummaryResponse);
  rpc GetSellerSettlements(GetSellerSettlementsRequest) returns (GetSellerSettlementsResponse);
  rpc GetSellerSettlementById(GetSellerSettlementByIdRequest) returns (SellerSettlementDetailResponse);
  rpc UpdateSellerSettlementStatus(UpdateSellerSettlementStatusRequest) returns (SellerSettlementDetailResponse);
}

message GetSellerSettlementSummaryRequest {
  optional string processId = 1;
  optional string shopId = 2;
}

message GetSellerSettlementsRequest {
  optional string processId = 1;
  optional string shopId = 2;
  int32 page = 3;
  int32 limit = 4;
  optional string settlementId = 5;
  optional string orderId = 6;
  optional string status = 7;
  optional string completedFrom = 8;
  optional string completedTo = 9;
  optional string availableFrom = 10;
  optional string availableTo = 11;
  optional int32 minAmount = 12;
  optional int32 maxAmount = 13;
  optional string sortBy = 14;
  optional string sortOrder = 15;
}

message GetSellerSettlementByIdRequest {
  optional string processId = 1;
  string settlementId = 2;
  optional string shopId = 3;
}

message UpdateSellerSettlementStatusRequest {
  optional string processId = 1;
  string settlementId = 2;
  string action = 3;
  optional string reason = 4;
  string actorId = 5;
}

message SellerSettlementResponse {
  string id = 1;
  string orderId = 2;
  string shopId = 3;
  optional string creditId = 4;
  int32 grossAmount = 5;
  float commissionRate = 6;
  int32 commissionFee = 7;
  float taxRate = 8;
  int32 taxWithheld = 9;
  int32 netSellerAmount = 10;
  string status = 11;
  string completedAt = 12;
  string availableAt = 13;
  optional string processingStartedAt = 14;
  optional string settledAt = 15;
  optional string heldAt = 16;
  optional string heldBy = 17;
  optional string holdReason = 18;
  optional string releasedAt = 19;
  optional string releasedBy = 20;
  optional string cancelledAt = 21;
  optional string cancelledBy = 22;
  optional string cancelReason = 23;
  int32 attemptCount = 24;
  optional string lastError = 25;
  int32 version = 26;
  string createdAt = 27;
  string updatedAt = 28;
}

message SellerSettlementHistoryResponse {
  string id = 1;
  string settlementId = 2;
  string action = 3;
  string fromStatus = 4;
  string toStatus = 5;
  optional string reason = 6;
  string actorId = 7;
  string createdAt = 8;
}

message SellerSettlementDetailResponse {
  string id = 1;
  string orderId = 2;
  string shopId = 3;
  optional string creditId = 4;
  int32 grossAmount = 5;
  float commissionRate = 6;
  int32 commissionFee = 7;
  float taxRate = 8;
  int32 taxWithheld = 9;
  int32 netSellerAmount = 10;
  string status = 11;
  string completedAt = 12;
  string availableAt = 13;
  optional string processingStartedAt = 14;
  optional string settledAt = 15;
  optional string heldAt = 16;
  optional string heldBy = 17;
  optional string holdReason = 18;
  optional string releasedAt = 19;
  optional string releasedBy = 20;
  optional string cancelledAt = 21;
  optional string cancelledBy = 22;
  optional string cancelReason = 23;
  int32 attemptCount = 24;
  optional string lastError = 25;
  int32 version = 26;
  string createdAt = 27;
  string updatedAt = 28;
  repeated SellerSettlementHistoryResponse histories = 29;
}

message GetSellerSettlementsResponse {
  int32 page = 1;
  int32 limit = 2;
  int32 totalItems = 3;
  int32 totalPages = 4;
  repeated SellerSettlementResponse settlements = 5;
}

message GetSellerSettlementSummaryResponse {
  int32 pendingAmount = 1;
  int32 pendingCount = 2;
  int32 dueWithin24HoursAmount = 3;
  int32 dueWithin24HoursCount = 4;
  int32 heldAmount = 5;
  int32 heldCount = 6;
  int32 failedAmount = 7;
  int32 failedCount = 8;
  int32 settledAmount = 9;
  int32 settledCount = 10;
  optional string nextAvailableAt = 11;
  int32 nextAvailableAmount = 12;
}

service PayoutModule {
  rpc CreateShopPayout(CreateShopPayoutRequest) returns (ShopPayoutResponse);
  rpc GetShopPayoutById(GetShopPayoutByIdRequest) returns (ShopPayoutResponse);
  rpc GetShopPayouts(GetShopPayoutsRequest) returns (GetShopPayoutsResponse);
  rpc UpdateShopPayoutStatus(UpdateShopPayoutStatusRequest) returns (ShopPayoutResponse);
  rpc DeleteShopPayout(DeleteShopPayoutRequest) returns (ShopPayoutResponse);
}

message CreateShopPayoutRequest {
  optional string processId = 1;
  string shopId = 2;
  int32 amount = 3;
  string bankName = 4;
  string accountNumber = 5;
  string accountHolder = 6;
  optional string note = 7;
}

message GetShopPayoutByIdRequest {
  optional string processId = 1;
  string shopId = 2;
  string payoutId = 3;
}

message GetShopPayoutsRequest {
  optional string processId = 1;
  optional string shopId = 2;
  int32 page = 3;
  int32 limit = 4;
  optional string status = 5;
}

message UpdateShopPayoutStatusRequest {
  optional string processId = 1;
  string shopId = 2;
  string payoutId = 3;
  string status = 4;
  optional string rejectReason = 5;
}

message DeleteShopPayoutRequest {
  optional string processId = 1;
  string shopId = 2;
  string payoutId = 3;
}

message ShopPayoutResponse {
  string id = 1;
  string creditId = 2;
  string shopId = 3;
  int32 amount = 4;
  string bankName = 5;
  string accountNumber = 6;
  string accountHolder = 7;
  optional string note = 8;
  string status = 9;
  optional string rejectReason = 10;
  optional string processedAt = 11;
  string createdAt = 12;
  string updatedAt = 13;
}

message GetShopPayoutsResponse {
  int32 page = 1;
  int32 limit = 2;
  int32 totalItems = 3;
  int32 totalPages = 4;
  repeated ShopPayoutResponse payouts = 5;
}

service PlatformLedgerModule {
  rpc RecordPlatformLedger(RecordPlatformLedgerRequest) returns (PlatformLedgerResponse);
  rpc GetPlatformRevenueSummary(GetPlatformRevenueSummaryRequest) returns (GetPlatformRevenueSummaryResponse);
  rpc GetPlatformLedgerList(GetPlatformLedgerListRequest) returns (GetPlatformLedgerListResponse);
}

message RecordPlatformLedgerRequest {
  optional string processId = 1;
  string orderId = 2;
  string shopId = 3;
  int32 grossAmount = 4;
  float commissionRate = 5;
  int32 commissionFee = 6;
  float taxRate = 7;
  int32 taxWithheld = 8;
  int32 netSellerAmount = 9;
}

message PlatformLedgerResponse {
  string id = 1;
  string orderId = 2;
  string shopId = 3;
  int32 grossAmount = 4;
  float commissionRate = 5;
  int32 commissionFee = 6;
  float taxRate = 7;
  int32 taxWithheld = 8;
  int32 netSellerAmount = 9;
  string createdAt = 10;
}

message GetPlatformRevenueSummaryRequest {
  optional string processId = 1;
  optional string startDate = 2;
  optional string endDate = 3;
  optional string shopId = 4;
}

message GetPlatformRevenueSummaryResponse {
  int32 totalGMV = 1;
  int32 totalCommission = 2;
  int32 totalTaxWithheld = 3;
  int32 totalNetSellerAmount = 4;
  int32 totalPendingPayouts = 5;
}

message GetPlatformLedgerListRequest {
  optional string processId = 1;
  int32 page = 2;
  int32 limit = 3;
  optional string shopId = 4;
  optional string startDate = 5;
  optional string endDate = 6;
  optional string sortBy = 7;
  optional string sortOrder = 8;
}

message GetPlatformLedgerListResponse {
  int32 page = 1;
  int32 limit = 2;
  int32 totalItems = 3;
  int32 totalPages = 4;
  repeated PlatformLedgerResponse items = 5;
}
