syntax = "proto3";

package PROMOTION_SERVICE;

service PromotionModule {
  rpc GetManyPromotions(GetManyPromotionsRequest) returns (GetManyPromotionsResponse);
  rpc GetPromotion(GetPromotionRequest) returns (PromotionResponse);
  rpc CreatePromotion(CreatePromotionRequest) returns (PromotionResponse);
  rpc UpdatePromotion(UpdatePromotionRequest) returns (PromotionResponse);
  rpc DeletePromotion(DeletePromotionRequest) returns (PromotionResponse);

  rpc CheckPromotion(CheckPromotionRequest) returns (PromotionResponse);
}

// Request Messages
message GetManyPromotionsRequest {
  optional string processId = 1;
  optional string code = 2;
  optional string name = 3;
  optional string status = 4;
  optional string startsAt = 5;
  optional string endsAt = 6;
  optional string scope = 7;
  optional string discountType = 8;
  int32 page = 9;
  int32 limit = 10;
  optional bool includeUsed = 11;
  optional string userId = 12;
}

message GetPromotionRequest {
  optional string processId = 1;
  optional string id = 2;
  optional string code = 3;
}

message CreatePromotionRequest {
  optional string processId = 1;
  string code = 2;
  string name = 3;
  optional string description = 4;
  string status = 5;
  string startsAt = 6;
  string endsAt = 7;
  string scope = 8;
  int32 minOrderSubtotal = 9;
  string discountType = 10;
  int32 discountValue = 11;
  optional int32 maxDiscount = 12;
  optional int32 totalLimit = 13;
  string createdById = 14;
}

message UpdatePromotionRequest {
  optional string processId = 1;
  string id = 2;
  optional string code = 3;
  optional string name = 4;
  optional string description = 5;
  optional string status = 6;
  optional string startsAt = 7;
  optional string endsAt = 8;
  optional string scope = 9;
  optional int32 minOrderSubtotal = 10;
  optional string discountType = 11;
  optional int32 discountValue = 12;
  optional int32 maxDiscount = 13;
  optional int32 totalLimit = 14;
  string updatedById = 15;
}

message DeletePromotionRequest {
  string id = 1;
  string deletedById = 2;
  optional string processId = 3;
}

// Response Messages
message PromotionResponse {
  string id = 1;
  string code = 2;
  string name = 3;
  optional string description = 4;
  string status = 5;
  string startsAt = 6;
  string endsAt = 7;
  string scope = 8;
  int32 minOrderSubtotal = 9;
  string discountType = 10;
  int32 discountValue = 11;
  optional int32 maxDiscount = 12;
  optional int32 totalLimit = 13;
  int32 usedCount = 14;
  optional string createdById = 15;
  optional string updatedById = 16;
  optional string deletedById = 17;
  optional string deletedAt = 18;
  string createdAt = 19;
  string updatedAt = 20;
}

message PromotionListItem {
  string id = 1;
  string code = 2;
  string name = 3;
  string startsAt = 4;
  string endsAt = 5;
  string status = 6;
  string scope = 7;
  string discountType = 8;
  optional int32 totalLimit = 9;
  int32 usedCount = 10;
}

message GetManyPromotionsResponse {
  int32 page = 1;
  int32 limit = 2;
  int32 totalItems = 3;
  int32 totalPages = 4;
  repeated PromotionListItem promotions = 5;
}

// Check Promotion Request
message CheckPromotionRequest {
  optional string processId = 1;
  string code = 2;
  string userId = 3;
}

//============================================ Redemption Messages ===================================//

service RedemptionModule {
  rpc ClaimPromotion(ClaimPromotionRequest) returns (PromotionRedemptionResponse);
  rpc GetMyVouchers(GetMyVouchersRequest) returns (GetMyVouchersResponse);
}

service MarketingModule {
  rpc GetManyMarketingCampaigns(GetManyMarketingCampaignsRequest) returns (GetManyMarketingCampaignsResponse);
  rpc GetMarketingCampaign(GetMarketingCampaignRequest) returns (MarketingCampaignResponse);
  rpc CreateMarketingCampaign(CreateMarketingCampaignRequest) returns (MarketingCampaignResponse);
  rpc DispatchMarketingCampaign(DispatchMarketingCampaignRequest) returns (MarketingOperationResponse);
  rpc ScanMarketing(ScanMarketingRequest) returns (MarketingOperationResponse);
  rpc ProcessMarketingDelivery(ProcessMarketingDeliveryRequest) returns (MarketingDeliveryResponse);
  rpc RecordMarketingWebhook(RecordMarketingWebhookRequest) returns (MarketingOperationResponse);
}

message GetManyMarketingCampaignsRequest {
  optional string processId = 1;
  optional string status = 2;
  int32 page = 3;
  int32 limit = 4;
}

message GetMarketingCampaignRequest {
  optional string processId = 1;
  string id = 2;
}

message CreateMarketingCampaignRequest {
  optional string processId = 1;
  string name = 2;
  string promotionId = 3;
  string subject = 4;
  optional string preheader = 5;
  string introContent = 6;
  optional string scheduledAt = 7;
  string createdById = 8;
}

message DispatchMarketingCampaignRequest {
  optional string processId = 1;
  string id = 2;
}

message ScanMarketingRequest {
  optional string processId = 1;
  optional string now = 2;
}

message ProcessMarketingDeliveryRequest {
  optional string processId = 1;
  string deliveryId = 2;
}

message RecordMarketingWebhookRequest {
  optional string processId = 1;
  string payload = 2;
  string svixId = 3;
  string svixTimestamp = 4;
  string svixSignature = 5;
}

message MarketingCampaignResponse {
  string id = 1;
  string name = 2;
  string type = 3;
  string status = 4;
  string promotionId = 5;
  string promotionCode = 6;
  string promotionName = 7;
  string subject = 8;
  optional string preheader = 9;
  string introContent = 10;
  optional string scheduledAt = 11;
  optional string startedAt = 12;
  optional string completedAt = 13;
  int32 recipientCount = 14;
  int32 sentCount = 15;
  int32 deliveredCount = 16;
  int32 openedCount = 17;
  int32 clickedCount = 18;
  int32 bouncedCount = 19;
  int32 complainedCount = 20;
  string createdById = 21;
  string createdAt = 22;
  string updatedAt = 23;
}

message GetManyMarketingCampaignsResponse {
  int32 page = 1;
  int32 limit = 2;
  int32 totalItems = 3;
  int32 totalPages = 4;
  repeated MarketingCampaignResponse campaigns = 5;
}

message MarketingOperationResponse {
  bool accepted = 1;
  int32 queuedCount = 2;
  string message = 3;
}

message MarketingDeliveryResponse {
  string id = 1;
  string type = 2;
  string status = 3;
  optional string campaignId = 4;
  string promotionId = 5;
  optional string redemptionId = 6;
  string userId = 7;
  string recipientEmail = 8;
  optional string providerMessageId = 9;
  optional string errorMessage = 10;
  optional string sentAt = 11;
  string createdAt = 12;
}

message ClaimPromotionRequest {
  optional string processId = 1;
  string promotionId = 2;
  string userId = 3;
}

message GetMyVouchersRequest {
  optional string processId = 1;
  string userId = 2;
  int32 page = 3;
  int32 limit = 4;
  optional string status = 5;
}

message PromotionRedemptionResponse {
  string id = 1;
  string promotionId = 2;
  string userId = 3;
  repeated string orderIds = 4;
  string code = 5;
  string discountType = 6;
  int32 discountValue = 7;
  int32 minOrderSubtotal = 8;
  optional int32 maxDiscount = 9;
  string claimedAt = 10;
  optional string usedAt = 11;
  optional string cancelledAt = 12;
  string createdAt = 13;
  optional string promotionEndsAt = 14;
  optional string promotionStatus = 15;
}

message GetMyVouchersResponse {
  int32 page = 1;
  int32 limit = 2;
  int32 totalItems = 3;
  int32 totalPages = 4;
  repeated PromotionRedemptionResponse redemptions = 5;
}
